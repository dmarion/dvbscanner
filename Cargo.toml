[package]
name = "dvbscanner"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["dmarion"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1"

[build-dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"
